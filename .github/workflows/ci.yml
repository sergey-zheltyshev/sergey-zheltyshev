name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -c "from pathlib import Path; import xml.etree.ElementTree as ET; ET.parse('assets/cover.svg'); assert 'Systems Analyst & Software Engineer' in Path('README.md').read_text()"
